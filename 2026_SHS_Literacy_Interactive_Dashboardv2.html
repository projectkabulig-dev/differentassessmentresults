<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHS Literacy Assessment Dashboard — Division of Romblon</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Raleway:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
  :root{
    --navy:#1B3A6B;--blue:#2563EB;--teal:#0891B2;--green:#16A34A;
    --yellow:#CA8A04;--orange:#EA580C;--red:#DC2626;--purple:#7C3AED;
    --bg:#F0F4FF;--card:#FFFFFF;--border:#D1D5DB;--text:#1E293B;--muted:#64748B;
    --fru:#DC2626;--ins:#CA8A04;--ind:#16A34A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  header{background:linear-gradient(135deg,#4C1D95 0%,#7C3AED 60%,#2563EB 100%);color:#fff;padding:20px 32px 16px;display:flex;align-items:center;gap:18px;box-shadow:0 4px 20px rgba(76,29,149,.4);}
  .header-icon{font-size:2.6rem;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));}
  .header-text h1{font-family:'Raleway',sans-serif;font-size:1.35rem;font-weight:900;letter-spacing:.5px;}
  .header-text p{font-size:.78rem;opacity:.8;margin-top:2px;}
  .header-badge{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 14px;font-size:.75rem;font-weight:700;text-align:center;}
  .shell{max-width:1340px;margin:0 auto;padding:24px 20px;}
  .kpi-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-bottom:22px;}
  .kpi-card{background:var(--card);border-radius:14px;padding:18px 16px 14px;box-shadow:0 2px 10px rgba(0,0,0,.07);border-top:4px solid;transition:transform .15s,box-shadow .15s;}
  .kpi-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12);}
  .kpi-icon{font-size:1.6rem;margin-bottom:6px;}
  .kpi-val{font-family:'Raleway',sans-serif;font-size:1.75rem;font-weight:900;line-height:1;}
  .kpi-lbl{font-size:.7rem;color:var(--muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
  .main-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;}
  .panel{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden;}
  .panel-head{background:var(--navy);color:#fff;padding:13px 18px;font-size:.82rem;font-weight:800;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.6px;}
  .panel-body{padding:14px;overflow-y:auto;max-height:70vh;}
  .nav-tabs{display:flex;gap:0;background:#EEF2FF;border-bottom:2px solid #C7D2FE;}
  .nav-tab{flex:1;padding:9px 4px;text-align:center;font-size:.68rem;font-weight:700;cursor:pointer;color:var(--muted);border:none;background:transparent;transition:all .15s;text-transform:uppercase;letter-spacing:.3px;}
  .nav-tab.active{color:var(--navy);background:#fff;border-bottom:2px solid var(--navy);margin-bottom:-2px;}
  .nav-tab:hover:not(.active){background:#E0E7FF;color:var(--navy);}
  .list-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;cursor:pointer;margin-bottom:5px;transition:background .12s,transform .1s;border:1.5px solid transparent;}
  .list-item:hover{background:#EEF2FF;transform:translateX(2px);border-color:#C7D2FE;}
  .list-item.active{background:#EEF2FF;border-color:var(--navy);}
  .list-icon{font-size:1.3rem;flex-shrink:0;}
  .list-name{font-weight:700;font-size:.82rem;flex:1;}
  .list-sub{font-size:.7rem;color:var(--muted);}
  .list-badge{font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:20px;color:#fff;flex-shrink:0;}
  .mini-bar-wrap{height:5px;background:#E2E8F0;border-radius:3px;margin-top:3px;overflow:hidden;width:100%;}
  .mini-bar{height:100%;border-radius:3px;transition:width .4s ease;}
  .right-panel{display:flex;flex-direction:column;gap:18px;}
  .detail-card{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden;}
  .detail-head{padding:18px 22px;background:linear-gradient(135deg,#4C1D95,#7C3AED);color:#fff;}
  .detail-head h2{font-family:'Raleway',sans-serif;font-size:1.15rem;font-weight:900;}
  .detail-head p{font-size:.78rem;opacity:.8;margin-top:3px;}
  .detail-body{padding:20px 22px;}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .stat-box{background:#F8FAFF;border-radius:10px;padding:12px 14px;text-align:center;border:1.5px solid #E0E7FF;}
  .stat-box .sv{font-size:1.5rem;font-weight:900;font-family:'Raleway',sans-serif;}
  .stat-box .sl{font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase;margin-top:2px;}
  .prof-table{width:100%;border-collapse:collapse;font-size:.82rem;}
  .prof-table th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;}
  .prof-table td{padding:8px 12px;border-bottom:1px solid #F1F5F9;vertical-align:middle;}
  .prof-table tr:last-child td{border-bottom:none;}
  .prof-table tr:hover td{background:#F8FAFF;}
  .bar-cell{display:flex;align-items:center;gap:8px;}
  .bar-bg{flex:1;height:8px;background:#E2E8F0;border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);}
  .pct-text{font-weight:800;width:46px;text-align:right;font-size:.8rem;}
  .count-text{font-weight:700;text-align:right;color:var(--muted);font-size:.8rem;}
  .lang-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .lang-tab{padding:7px 22px;border-radius:20px;border:2px solid var(--border);background:transparent;font-size:.8rem;font-weight:800;cursor:pointer;color:var(--muted);transition:all .15s;}
  .lang-tab.fil.active{background:#7C3AED;color:#fff;border-color:#7C3AED;}
  .lang-tab.eng.active{background:#1B3A6B;color:#fff;border-color:#1B3A6B;}
  .lang-tab:hover:not(.active){border-color:var(--navy);color:var(--navy);}
  .section-sep{height:1px;background:#E0E7FF;margin:20px 0;}
  .summary-section-title{font-size:.8rem;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #E0E7FF;}
  .back-btn{display:inline-flex;align-items:center;gap:5px;background:#EEF2FF;border:1.5px solid #C7D2FE;border-radius:8px;padding:5px 12px;font-size:.75rem;font-weight:700;cursor:pointer;color:var(--navy);margin-bottom:14px;transition:background .12s;}
  .back-btn:hover{background:#E0E7FF;}
  .search-wrap{position:relative;margin-bottom:12px;}
  .search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1.5px solid var(--border);border-radius:8px;font-size:.8rem;font-family:'Nunito',sans-serif;outline:none;transition:border .15s;}
  .search-wrap input:focus{border-color:var(--blue);}
  .search-wrap .s-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.9rem;color:var(--muted);}
  .placeholder{text-align:center;padding:60px 20px;color:var(--muted);}
  .placeholder .ph-icon{font-size:3rem;margin-bottom:12px;}
  /* Reading level pills */
  .level-fru{color:#DC2626;background:#FEF2F2;border-radius:6px;padding:2px 7px;font-size:.68rem;font-weight:800;}
  .level-ins{color:#CA8A04;background:#FEFCE8;border-radius:6px;padding:2px 7px;font-size:.68rem;font-weight:800;}
  .level-ind{color:#16A34A;background:#F0FDF4;border-radius:6px;padding:2px 7px;font-size:.68rem;font-weight:800;}
  /* Donut */
  .donut-wrap{flex-shrink:0;position:relative;width:120px;height:120px;}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut-center .dc-val{font-size:1.3rem;font-weight:900;font-family:'Raleway',sans-serif;}
  .donut-center .dc-lbl{font-size:.58rem;color:var(--muted);font-weight:700;text-align:center;}
  .donut-row{display:flex;align-items:center;gap:20px;margin-bottom:18px;}
  .legend-list{flex:1;}
  .legend-item{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:.76rem;}
  .legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
  .legend-name{flex:1;color:var(--text);font-weight:600;}
  .legend-val{font-weight:800;font-size:.76rem;}
  /* Domain grid */
  .domain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .domain-card{background:#F8FAFF;border-radius:10px;padding:12px 14px;border:1.5px solid #E0E7FF;text-align:center;}
  .domain-card .dv{font-size:1.3rem;font-weight:900;font-family:'Raleway',sans-serif;}
  .domain-card .dl{font-size:.65rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:3px;}
  /* Rankings */
  .rankings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .rank-card{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.07);overflow:hidden;}
  .rank-head{padding:13px 18px;font-size:.82rem;font-weight:800;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.6px;color:#fff;}
  .rank-head.top{background:linear-gradient(135deg,#16A34A,#0891B2);}
  .rank-head.bot{background:linear-gradient(135deg,#DC2626,#EA580C);}
  .rank-table{width:100%;border-collapse:collapse;font-size:.8rem;}
  .rank-table th{background:#F8FAFF;color:var(--navy);padding:8px 12px;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #E0E7FF;}
  .rank-table td{padding:8px 12px;border-bottom:1px solid #F1F5F9;vertical-align:middle;}
  .rank-table tr:last-child td{border-bottom:none;}
  .rank-table tr:hover td{background:#F8FAFF;cursor:pointer;}
  .rank-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;font-weight:900;font-size:.8rem;flex-shrink:0;}
  .rank-gold{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;}
  .rank-silver{background:linear-gradient(135deg,#C0C0C0,#909090);color:#000;}
  .rank-bronze{background:linear-gradient(135deg,#CD7F32,#8B4513);color:#fff;}
  .rank-other{background:#EEF2FF;color:var(--navy);}
  .rank-select{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.78rem;font-family:'Nunito',sans-serif;color:var(--text);background:var(--card);outline:none;cursor:pointer;}
  .rank-select:focus{border-color:var(--blue);}
  .sector-badge{display:inline-block;font-size:.62rem;font-weight:800;padding:1px 7px;border-radius:10px;margin-left:5px;}
  .sector-pub{background:#EFF6FF;color:#1B3A6B;}
  .sector-pri{background:#FAF5FF;color:#7C3AED;}
  @media(max-width:900px){.main-grid{grid-template-columns:1fr;}.kpi-strip{grid-template-columns:repeat(4,1fr);}.rankings-grid{grid-template-columns:1fr;}}
  @media(max-width:600px){.kpi-strip{grid-template-columns:repeat(2,1fr);}.stats-row{grid-template-columns:repeat(2,1fr);}.domain-grid{grid-template-columns:1fr 1fr;}}
  </style>
</head>

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function pct(n,d){return d>0?(n/d*100).toFixed(1)+'%':'0%';}
function pctN(n,d){return d>0?n/d*100:0;}
function sumKey(arr,lang,key){return arr.reduce((a,s)=>a+(s[lang][key]||0),0);}
function divTotal(){
  return {
    enrolled:RAW.reduce((a,s)=>a+s.enrolled,0),
    assessed:RAW.reduce((a,s)=>a+s.assessed,0),
    fil:{
      assessed:sumKey(RAW,'fil','assessed'),
      frustration:sumKey(RAW,'fil','frustration'),
      instructional:sumKey(RAW,'fil','instructional'),
      independent:sumKey(RAW,'fil','independent'),
      literal:sumKey(RAW,'fil','literal'),
      inference:sumKey(RAW,'fil','inference'),
      knowledge:sumKey(RAW,'fil','knowledge')
    },
    eng:{
      assessed:sumKey(RAW,'eng','assessed'),
      frustration:sumKey(RAW,'eng','frustration'),
      instructional:sumKey(RAW,'eng','instructional'),
      independent:sumKey(RAW,'eng','independent'),
      literal:sumKey(RAW,'eng','literal'),
      inference:sumKey(RAW,'eng','inference'),
      knowledge:sumKey(RAW,'eng','knowledge')
    }
  };
}
function getBadgeColorInd(pctNum){
  if(pctNum>=50) return '#16A34A';
  if(pctNum>=25) return '#2563EB';
  if(pctNum>=10) return '#CA8A04';
  return '#DC2626';
}
function getFruBadgeColor(pctNum){
  if(pctNum>=80) return '#DC2626';
  if(pctNum>=60) return '#EA580C';
  if(pctNum>=40) return '#CA8A04';
  return '#16A34A';
}

let activeTab='schools', selSchool=null, selLang='fil', searchQ='';
let rankLang='fil', rankMetric='ind_pct', rankSector='';
let navLevel='independent', levelNavLang='fil';

// ─── KPI ─────────────────────────────────────────────────────────────────────
function renderKPI(){
  const d=divTotal();
  const pub=RAW.filter(s=>s.sector==='Public').length;
  const pri=RAW.filter(s=>s.sector==='Private').length;
  const kpis=[
    {icon:'&#127979;',val:RAW.length,lbl:'Total Schools',sub:pub+'P / '+pri+'Priv',color:'#1B3A6B'},
    {icon:'&#128203;',val:d.enrolled.toLocaleString(),lbl:'Enrolled',sub:'SHS Learners',color:'#2563EB'},
    {icon:'&#9989;',val:d.assessed.toLocaleString(),lbl:'Assessed',sub:'Learners',color:'#0891B2'},
    {icon:'&#128218;',val:pct(d.fil.independent,d.fil.assessed),lbl:'Filipino Ind.',sub:'Independent Readers',color:'#7C3AED'},
    {icon:'&#128218;',val:pct(d.eng.independent,d.eng.assessed),lbl:'English Ind.',sub:'Independent Readers',color:'#1B3A6B'},
    {icon:'&#9888;',val:pct(d.fil.frustration,d.fil.assessed),lbl:'Filipino Fru.',sub:'At Frustration Level',color:'#DC2626'},
    {icon:'&#9888;',val:pct(d.eng.frustration,d.eng.assessed),lbl:'English Fru.',sub:'At Frustration Level',color:'#EA580C'},
  ];
  document.getElementById('kpiStrip').innerHTML=kpis.map(k=>`<div class="kpi-card" style="border-top-color:${k.color}"><div class="kpi-icon">${k.icon}</div><div class="kpi-val" style="color:${k.color}">${k.val}</div><div class="kpi-lbl">${k.lbl}<br><span style="color:#94A3B8;font-size:.65rem">${k.sub}</span></div></div>`).join('');
}

// ─── TABS ────────────────────────────────────────────────────────────────────
function switchTab(tab){
  activeTab=tab;
  if(tab!=='rankings'){selSchool=null;searchQ='';}
  document.querySelectorAll('.nav-tab').forEach((b,i)=>{b.classList.toggle('active',['schools','levels','domains','rankings'][i]===tab);});
  renderNav(); renderDetail();
}

function renderNav(){
  const nb=document.getElementById('navBody');
  if(activeTab==='schools') renderSchoolsNav(nb);
  else if(activeTab==='levels') renderLevelsNav(nb);
  else if(activeTab==='domains') renderDomainsNav(nb);
  else renderRankingsNav(nb);
}

// ─── SCHOOLS NAV ─────────────────────────────────────────────────────────────
function renderSchoolsNav(nb){
  // sector filter pills + search
  const sectorPills=['','Public','Private'].map(s=>`<span onclick="rankSector='${s}';renderSchoolsNav(document.getElementById('navBody'));" style="cursor:pointer;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:12px;background:${rankSector===s?'var(--navy)':'#EEF2FF'};color:${rankSector===s?'#fff':'var(--muted)'};border:1.5px solid ${rankSector===s?'var(--navy)':'#C7D2FE'}">${s||'All'}</span>`).join('');
  nb.innerHTML=`<div style="padding:10px 4px 6px"><div class="search-wrap"><span class="s-icon">&#128269;</span><input placeholder="Search school..." oninput="searchQ=this.value;renderSchoolsNav(document.getElementById('navBody'))" value="${searchQ}" autofocus></div><div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:6px;"><span style="font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;">Filter:</span>${sectorPills}</div></div>`;
  let list=RAW.filter(s=>(rankSector===''||s.sector===rankSector)&&(s.name.toLowerCase().includes(searchQ.toLowerCase())));
  list.forEach(s=>{
    const ind_f=pctN(s.fil.independent,s.fil.assessed);
    const ind_e=pctN(s.eng.independent,s.eng.assessed);
    const fru_f=pctN(s.fil.frustration,s.fil.assessed);
    const el=document.createElement('div');
    el.className='list-item'+(selSchool===s.name?' active':'');
    const sIcon=s.sector==='Public'?'&#127983;':'&#127979;';
    el.innerHTML=`<div class="list-icon">${sIcon}</div><div style="flex:1;min-width:0"><div class="list-name">${s.name}<span class="sector-badge sector-${s.sector==='Public'?'pub':'pri'}">${s.sector}</span></div><div class="list-sub">${s.assessed.toLocaleString()} assessed</div><div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;"><span class="level-ind">FIL-Ind ${ind_f.toFixed(0)}%</span><span class="level-ind">ENG-Ind ${ind_e.toFixed(0)}%</span><span style="font-size:.62rem;font-weight:700;color:#DC2626;background:#FEF2F2;border-radius:4px;padding:1px 5px;">FIL-Fru ${fru_f.toFixed(0)}%</span></div><div class="mini-bar-wrap" style="margin-top:5px"><div class="mini-bar" style="width:${ind_f}%;background:#7C3AED"></div></div></div>`;
    el.onclick=()=>{selSchool=s.name;renderNav();renderDetail();};
    nb.appendChild(el);
  });
  if(!list.length) nb.innerHTML+=`<div class="placeholder"><div class="ph-icon">&#128268;</div><p>No schools match</p></div>`;
}

// ─── LEVELS NAV ──────────────────────────────────────────────────────────────
function renderLevelsNav(nb){
  const d=divTotal();
  const langPills=['fil','eng'].map(l=>`<span onclick="levelNavLang='${l}';levelDetailView='schools';levelDetailMunFilter='';renderLevelsNav(document.getElementById('navBody'));" style="cursor:pointer;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:12px;background:${levelNavLang===l?(l==='fil'?'#7C3AED':'#1B3A6B'):'#EEF2FF'};color:${levelNavLang===l?'#fff':'var(--muted)'};border:1.5px solid ${levelNavLang===l?(l==='fil'?'#7C3AED':'#1B3A6B'):'#C7D2FE'}">${l==='fil'?'&#127477; Filipino':'&#127468;&#127463; English'}</span>`).join('');
  nb.innerHTML=`<div style="padding:10px 4px 8px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;"><span style="font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;">Language:</span>${langPills}</div>`;
  const ld=d[levelNavLang];
  ['independent','instructional','frustration'].forEach(level=>{
    const cnt=ld[level];
    const p=pctN(cnt,ld.assessed);
    const color=LEVEL_COLORS[level];
    const el=document.createElement('div');
    el.className='list-item'+(navLevel===level?' active':'');
    el.innerHTML=`<div class="list-icon" style="font-size:1.5rem">${LEVEL_ICONS[level]}</div><div style="flex:1;min-width:0"><div class="list-name" style="color:${color}">${LEVEL_LABELS[level]}</div><div class="list-sub">${cnt.toLocaleString()} learners · ${p.toFixed(1)}% of assessed</div><div class="mini-bar-wrap"><div class="mini-bar" style="width:${p}%;background:${color}"></div></div></div>`;
    el.onclick=()=>{navLevel=level;levelDetailView='schools';levelDetailMunFilter='';renderLevelsDetail(level,levelNavLang);renderLevelsNav(document.getElementById('navBody'));};
    nb.appendChild(el);
  });
}

// ─── DOMAINS NAV ─────────────────────────────────────────────────────────────
let domainSector=''; // '' | 'Public' | 'Private'

function renderDomainsNav(nb){
  // compute filtered totals for nav display
  const pool=domainSector===''?RAW:RAW.filter(s=>s.sector===domainSector);
  const filA=pool.reduce((a,s)=>a+s.fil.assessed,0);
  const engA=pool.reduce((a,s)=>a+s.eng.assessed,0);
  const getSum=(lang,key)=>pool.reduce((a,s)=>a+s[lang][key],0);

  const langPills=['fil','eng'].map(l=>`<span onclick="levelNavLang='${l}';levelDetailView='schools';levelDetailMunFilter='';renderDomainsNav(document.getElementById('navBody'));renderDomainsDetail(levelNavLang);" style="cursor:pointer;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:12px;background:${levelNavLang===l?(l==='fil'?'#7C3AED':'#1B3A6B'):'#EEF2FF'};color:${levelNavLang===l?'#fff':'var(--muted)'};border:1.5px solid ${levelNavLang===l?(l==='fil'?'#7C3AED':'#1B3A6B'):'#C7D2FE'}">${l==='fil'?'&#127477; Filipino':'&#127468;&#127463; English'}</span>`).join('');

  const sectorOpts=[
    {v:'',   icon:'&#127968;&#127979;', label:'All',     tip:'Public + Private'},
    {v:'Public',  icon:'&#127968;',     label:'Public',  tip:'Public Schools Only'},
    {v:'Private', icon:'&#127979;',     label:'Private', tip:'Private Schools Only'},
  ];
  const sectorPills=sectorOpts.map(o=>`<span onclick="domainSector='${o.v}';renderDomainsNav(document.getElementById('navBody'));renderDomainsDetail(levelNavLang);" title="${o.tip}" style="cursor:pointer;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:12px;background:${domainSector===o.v?'#1B3A6B':'#EEF2FF'};color:${domainSector===o.v?'#fff':'var(--muted)'};border:1.5px solid ${domainSector===o.v?'#1B3A6B':'#C7D2FE'};display:inline-flex;align-items:center;gap:4px;">${o.icon} ${o.label}</span>`).join('');

  nb.innerHTML=`<div style="padding:10px 4px 4px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;"><span style="font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;">Language:</span>${langPills}</div>
  <div style="padding:4px 4px 8px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;"><span style="font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;">Sector:</span>${sectorPills}</div>`;

  const assessed=levelNavLang==='fil'?filA:engA;
  ['literal','inference','knowledge'].forEach(dom=>{
    const cnt=getSum(levelNavLang,dom);
    const p=pctN(cnt,assessed);
    const color=DOMAIN_COLORS[dom];
    const el=document.createElement('div');
    el.className='list-item';
    el.innerHTML=`<div class="list-icon" style="font-size:1.5rem">${DOMAIN_ICONS[dom]}</div><div style="flex:1;min-width:0"><div class="list-name" style="color:${color}">${DOMAIN_LABELS[dom]}</div><div class="list-sub">${cnt.toLocaleString()} learners · ${p.toFixed(1)}% of assessed</div><div class="mini-bar-wrap"><div class="mini-bar" style="width:${p}%;background:${color}"></div></div></div>`;
    el.onclick=()=>{renderDomainsDetail(levelNavLang);};
    nb.appendChild(el);
  });
  renderDomainsDetail(levelNavLang);
}

// ─── DONUT HELPER ────────────────────────────────────────────────────────────
function drawDonut(canvasId,data,total){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const cx=60,cy=60,r=50,iR=34;
  ctx.clearRect(0,0,120,120);
  const colors=[LEVEL_COLORS.frustration,LEVEL_COLORS.instructional,LEVEL_COLORS.independent];
  const vals=[data.frustration,data.instructional,data.independent];
  let start=-Math.PI/2;
  vals.forEach((v,i)=>{
    const slice=(v/total)*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,start+slice);ctx.closePath();
    ctx.fillStyle=colors[i];ctx.fill();start+=slice;
  });
  ctx.beginPath();ctx.arc(cx,cy,iR,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
}

  }

  document.getElementById('detailBody').innerHTML=`
  <div style="background:#FFF7ED;border:1.5px solid ${color};border-radius:10px;padding:14px;margin-bottom:14px">
    <div style="font-weight:800;color:${color};font-size:.9rem">${LEVEL_ICONS[level]} ${LEVEL_LABELS[level]} · ${langLabel}</div>

  <div style="background:#F0FDF4;border:1.5px solid #86EFAC;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;">
    <div style="font-size:1.3rem">${sectorIcon}</div>
    <div><div style="font-weight:800;color:var(--navy);font-size:.85rem">${sectorLabel}</div>
    <div style="font-size:.75rem;color:var(--muted)">${pool.length} schools · ${agg.assessed.toLocaleString()} assessed</div></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">${sectorCompare}</div>
  <div class="domain-grid" style="margin-bottom:20px;">
    ${['literal','inference','knowledge'].map(dom=>{const cnt=agg[dom];const p=pctN(cnt,agg.assessed);return `<div class="domain-card"><div class="dv" style="color:${DOMAIN_COLORS[dom]}">${cnt.toLocaleString()}</div><div style="font-size:.8rem;font-weight:700;margin:4px 0;color:${DOMAIN_COLORS[dom]}">${pct(cnt,agg.assessed)} of assessed</div><div class="dl">${DOMAIN_ICONS[dom]} ${DOMAIN_LABELS[dom]}</div></div>`;}).join('')}
  </div>
  <p class="summary-section-title">&#127983; Schools — Domain Breakdown (${langLabel})</p>
  <table class="prof-table">
    <thead><tr><th>School</th><th>Sector</th><th>Assessed</th><th>&#128270; Literal</th><th>&#129504; Inference</th><th>&#127747; Knowledge</th></tr></thead>
    <tbody>${[...pool].sort((a,b)=>pctN(b[lang].literal,b[lang].assessed)-pctN(a[lang].literal,a[lang].assessed)).map(s=>{
      const ld2=s[lang];
      const lp=pctN(ld2.literal,ld2.assessed);
      const ip=pctN(ld2.inference,ld2.assessed);
      const kp=pctN(ld2.knowledge,ld2.assessed);
      return `<tr onclick="selSchool='${s.name.replace(/'/g,"\\'")}';selLang='${lang}';switchTab('schools');renderDetail();" style="cursor:pointer">
        <td><b>${s.name}</b></td>
        <td><span class="sector-badge sector-${s.sector==='Public'?'pub':'pri'}">${s.sector}</span></td>
        <td class="count-text">${ld2.assessed}</td>
        <td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${lp}%;background:${DOMAIN_COLORS.literal}"></div></div><span class="pct-text" style="color:${DOMAIN_COLORS.literal}">${lp.toFixed(1)}%</span></div></td>
        <td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${ip}%;background:${DOMAIN_COLORS.inference}"></div></div><span class="pct-text" style="color:${DOMAIN_COLORS.inference}">${ip.toFixed(1)}%</span></div></td>
        <td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${kp}%;background:${DOMAIN_COLORS.knowledge}"></div></div><span class="pct-text" style="color:${DOMAIN_COLORS.knowledge}">${kp.toFixed(1)}%</span></div></td>
      </tr>`;
    }).join('')}</tbody>
  </table>
  <div style="margin-top:16px;font-size:.7rem;color:var(--muted);text-align:center">&#128204; Project KABULIG | SDO Romblon CID | Developed by Sir Dyon</div>`;
}

// ─── RANKINGS DETAIL ─────────────────────────────────────────────────────────
function renderRankingsDetail(){
  document.getElementById('detailTitle').textContent='&#127942; School Rankings';
  document.getElementById('detailSub').textContent=(rankLang==='fil'?'Filipino':'English')+' · '+(rankSector||'All Sectors')+' · SHS Literacy';
  let pool=RAW.filter(s=>rankSector===''||s.sector===rankSector);
  const metricLabels={ind_pct:'% Independent',ind:'No. Independent',fru_pct:'% Frustration',assessed:'Total Assessed'};
  const getVal=(s,m)=>{
    const ld=s[rankLang];
    if(m==='ind_pct') return pctN(ld.independent,ld.assessed);
    if(m==='ind') return ld.independent;
    if(m==='fru_pct') return pctN(ld.frustration,ld.assessed);
    return s.assessed;
  };
  const neg=rankMetric==='fru_pct';
  const sorted=[...pool].sort((a,b)=>neg?getVal(a,rankMetric)-getVal(b,rankMetric):getVal(b,rankMetric)-getVal(a,rankMetric));
  const top10=sorted.slice(0,10);
  const bot10=[...pool].sort((a,b)=>neg?getVal(b,rankMetric)-getVal(a,rankMetric):getVal(a,rankMetric)-getVal(b,rankMetric)).slice(0,10);
  const fmtVal=(s,m)=>{
    const v=getVal(s,m);
    return m.includes('pct')?v.toFixed(1)+'%':Math.round(v).toLocaleString();
  };
  const metricColor=(s)=>{
    const ind=pctN(s[rankLang].independent,s[rankLang].assessed);
    return getBadgeColorInd(ind);
  };
  const rankRow=(s,i)=>{
    const rnum=i===0?'rank-gold':i===1?'rank-silver':i===2?'rank-bronze':'rank-other';
    const col=metricColor(s);
    return `<tr onclick="selSchool='${s.name.replace(/'/g,"\\'")}';selLang='${rankLang}';switchTab('schools');renderDetail();" style="cursor:pointer">
      <td><span class="rank-num ${rnum}">${i+1}</span></td>
      <td><b>${s.name}</b><div style="font-size:.7rem;color:var(--muted)">${s.sector}</div></td>
      <td style="text-align:right"><b style="color:${col};font-size:.88rem">${fmtVal(s,rankMetric)}</b><div style="font-size:.68rem;color:var(--muted)">${s.assessed} assessed</div></td>
    </tr>`;
  };
  const langLabel=rankLang==='fil'?'Filipino':'English';
  const langColor=rankLang==='fil'?FIL_COLOR:ENG_COLOR;
  document.getElementById('detailBody').innerHTML=`
  <div style="background:#F0FDF4;border:1.5px solid #86EFAC;border-radius:10px;padding:12px 16px;margin-bottom:18px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;">
    <div><div style="font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:4px">Language</div><div style="font-weight:800;color:${langColor};font-size:.9rem">${langLabel}</div></div>
    <div style="border-left:1px solid #BBF7D0;padding-left:16px;"><div style="font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:4px">Metric</div><div style="font-weight:800;color:var(--navy);font-size:.9rem">&#128202; ${metricLabels[rankMetric]}</div></div>
    <div style="border-left:1px solid #BBF7D0;padding-left:16px;"><div style="font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:4px">Pool</div><div style="font-weight:800;color:var(--navy);font-size:.9rem">&#127983; ${pool.length} schools</div></div>
  </div>
  <div class="rankings-grid">
    <div class="rank-card"><div class="rank-head top">&#127942; Top 10 — ${metricLabels[rankMetric]}</div><table class="rank-table"><thead><tr><th>#</th><th>School</th><th style="text-align:right">${metricLabels[rankMetric]}</th></tr></thead><tbody>${top10.map((s,i)=>rankRow(s,i)).join('')}</tbody></table></div>
    <div class="rank-card"><div class="rank-head bot">&#9888;&#65039; Bottom 10 — Need Support</div><table class="rank-table"><thead><tr><th>#</th><th>School</th><th style="text-align:right">${metricLabels[rankMetric]}</th></tr></thead><tbody>${bot10.map((s,i)=>rankRow(s,i)).join('')}</tbody></table></div>
  </div>
  <div style="margin-top:16px;font-size:.7rem;color:var(--muted);text-align:center">&#128204; Project KABULIG | SDO Romblon CID | Developed by Sir Dyon</div>`;
}

// ─── INIT ────────────────────────────────────────────────────────────────────
renderKPI(); renderNav(); renderDivisionOverview();
</script>
