<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Grade 10 Math Mastery Assessment – Division of Romblon</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Raleway:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#1B3A6B;--blue:#2563EB;--teal:#0891B2;--green:#16A34A;
  --yellow:#CA8A04;--orange:#EA580C;--red:#DC2626;--indigo:#4F46E5;
  --bg:#EFF6FF;--card:#FFFFFF;--border:#D1D5DB;--text:#1E293B;--muted:#64748B;
  --accent:#EFF6FF;--accent2:#DBEAFE;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:linear-gradient(135deg,#1B3A6B 0%,#2563EB 55%,#0891B2 100%);color:#fff;padding:20px 32px 16px;display:flex;align-items:center;gap:18px;box-shadow:0 4px 20px rgba(27,58,107,.4);}
.header-icon{font-size:2.6rem;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));}
.header-text h1{font-family:'Raleway',sans-serif;font-size:1.35rem;font-weight:900;letter-spacing:.5px;}
.header-text p{font-size:.78rem;opacity:.8;margin-top:2px;}
.header-badge{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 16px;font-size:.75rem;font-weight:700;text-align:center;flex-shrink:0;}
.shell{max-width:1380px;margin:0 auto;padding:24px 20px;}

/* KPI STRIP */
.kpi-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:22px;}
.kpi-card{background:var(--card);border-radius:14px;padding:18px 16px 14px;box-shadow:0 2px 10px rgba(0,0,0,.07);border-top:4px solid;transition:transform .15s,box-shadow .15s;cursor:default;}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12);}
.kpi-icon{font-size:1.5rem;margin-bottom:6px;}
.kpi-val{font-family:'Raleway',sans-serif;font-size:1.75rem;font-weight:900;line-height:1;}
.kpi-lbl{font-size:.68rem;color:var(--muted);margin-top:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}

/* MAIN GRID */
.main-grid{display:grid;grid-template-columns:350px 1fr;gap:20px;}
.panel{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden;}
.panel-head{background:var(--navy);color:#fff;padding:13px 18px;font-size:.82rem;font-weight:800;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.6px;}
.panel-body{padding:10px;overflow-y:auto;max-height:72vh;}

/* LEFT NAV TABS */
.nav-tabs{display:flex;gap:0;background:#EFF6FF;border-bottom:2px solid #BFDBFE;}
.nav-tab{flex:1;padding:9px 4px;text-align:center;font-size:.66rem;font-weight:700;cursor:pointer;color:var(--muted);border:none;background:transparent;transition:all .15s;text-transform:uppercase;letter-spacing:.3px;}
.nav-tab.active{color:var(--navy);background:#fff;border-bottom:2px solid #2563EB;margin-bottom:-2px;}
.nav-tab:hover:not(.active){background:#DBEAFE;color:var(--navy);}

/* LIST ITEMS */
.list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px;transition:background .12s,transform .1s;border:1.5px solid transparent;}
.list-item:hover{background:#EFF6FF;transform:translateX(2px);border-color:#BFDBFE;}
.list-item.active{background:#EFF6FF;border-color:#2563EB;}
.list-icon{font-size:1.2rem;flex-shrink:0;}
.list-name{font-weight:700;font-size:.8rem;flex:1;}
.list-sub{font-size:.68rem;color:var(--muted);}
.list-badge{font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:20px;color:#fff;flex-shrink:0;}
.mini-bar-wrap{height:5px;background:#E2E8F0;border-radius:3px;margin-top:4px;overflow:hidden;}
.mini-bar{height:100%;border-radius:3px;transition:width .4s ease;}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:10px;}
.search-wrap input{width:100%;padding:8px 12px 8px 32px;border:1.5px solid var(--border);border-radius:8px;font-size:.8rem;font-family:'Nunito',sans-serif;outline:none;transition:border .15s;}
.search-wrap input:focus{border-color:#2563EB;}
.search-wrap .s-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.9rem;color:var(--muted);}

/* RIGHT DETAIL */
.right-panel{display:flex;flex-direction:column;gap:0;}
.detail-card{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden;}
.detail-head{padding:18px 22px;background:linear-gradient(135deg,#1B3A6B,#2563EB);color:#fff;}
.detail-head h2{font-family:'Raleway',sans-serif;font-size:1.15rem;font-weight:900;}
.detail-head p{font-size:.78rem;opacity:.8;margin-top:3px;}
.detail-body{padding:20px 22px;overflow-y:auto;max-height:72vh;}

/* STAT BOXES */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.stat-box{background:#EFF6FF;border-radius:10px;padding:12px 14px;text-align:center;border:1.5px solid #BFDBFE;}
.stat-box .sv{font-size:1.4rem;font-weight:900;font-family:'Raleway',sans-serif;}
.stat-box .sl{font-size:.66rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:2px;}

/* TABLES */
.prof-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.prof-table th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;}
.prof-table td{padding:8px 12px;border-bottom:1px solid #F1F5F9;vertical-align:middle;}
.prof-table tr:last-child td{border-bottom:none;}
.prof-table tr:hover td{background:#EFF6FF;cursor:pointer;}
.bar-cell{display:flex;align-items:center;gap:8px;}
.bar-bg{flex:1;height:8px;background:#E2E8F0;border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.pct-text{font-weight:800;min-width:42px;text-align:right;font-size:.78rem;}

/* SECTION TITLE */
.summary-section-title{font-size:.78rem;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #BFDBFE;}

/* RANKINGS */
.rankings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.rank-card{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.07);overflow:hidden;}
.rank-head{padding:13px 18px;font-size:.8rem;font-weight:800;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.6px;color:#fff;}
.rank-head.top{background:linear-gradient(135deg,#1B3A6B,#2563EB);}
.rank-head.bot{background:linear-gradient(135deg,#DC2626,#EA580C);}
.rank-table{width:100%;border-collapse:collapse;font-size:.78rem;}
.rank-table th{background:#EFF6FF;color:var(--navy);padding:8px 12px;text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #BFDBFE;}
.rank-table td{padding:8px 12px;border-bottom:1px solid #F1F5F9;vertical-align:middle;}
.rank-table tr:last-child td{border-bottom:none;}
.rank-table tr:hover td{background:#EFF6FF;cursor:pointer;}
.rank-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;font-weight:900;font-size:.78rem;flex-shrink:0;}
.rank-gold{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;}
.rank-silver{background:linear-gradient(135deg,#C0C0C0,#909090);color:#000;}
.rank-bronze{background:linear-gradient(135deg,#CD7F32,#8B4513);color:#fff;}
.rank-other{background:#EFF6FF;color:var(--navy);}

/* DONUT */
.donut-wrap{flex-shrink:0;position:relative;width:130px;height:130px;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.donut-center .dc-val{font-size:1.3rem;font-weight:900;font-family:'Raleway',sans-serif;}
.donut-center .dc-lbl{font-size:.56rem;color:var(--muted);font-weight:700;text-align:center;}
.donut-row{display:flex;align-items:center;gap:20px;margin-bottom:18px;}
.legend-list{flex:1;}
.legend-item{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:.76rem;}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.legend-name{flex:1;color:var(--text);font-weight:600;}
.legend-val{font-weight:800;font-size:.76rem;}

/* HEATMAP */
.heatmap-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:16px;}
.heatmap-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,box-shadow .15s;font-size:.65rem;}
.heatmap-cell:hover{transform:scale(1.12);box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:10;position:relative;}

/* PROFICIENCY BADGES */
.prof-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:10px;font-size:.68rem;font-weight:800;white-space:nowrap;}
.pb-hp{background:#DCFCE7;color:#15803D;}
.pb-p{background:#DBEAFE;color:#1D4ED8;}
.pb-np{background:#FEF3C7;color:#B45309;}
.pb-lp{background:#FEE2E2;color:#DC2626;}
.pb-nprof{background:#EDE9FE;color:#6D28D9;}

/* SECTION SEP */
.section-sep{height:1px;background:#BFDBFE;margin:16px 0;}

/* BACK BTN */
.back-btn{display:inline-flex;align-items:center;gap:5px;background:#EFF6FF;border:1.5px solid #BFDBFE;border-radius:8px;padding:5px 12px;font-size:.75rem;font-weight:700;cursor:pointer;color:var(--navy);margin-bottom:14px;transition:background .12s;}
.back-btn:hover{background:#DBEAFE;}

/* ITEM ANALYSIS SELECTS */
.filter-select{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.78rem;font-family:'Nunito',sans-serif;color:var(--text);background:var(--card);outline:none;cursor:pointer;margin-bottom:12px;}
.filter-select:focus{border-color:#2563EB;}

/* DISTRICT ITEM */
.dist-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px;transition:background .12s;border:1.5px solid transparent;}
.dist-item:hover{background:#EFF6FF;border-color:#BFDBFE;}
.dist-item.active{background:#EFF6FF;border-color:#2563EB;}

/* PLACEHOLDER */
.placeholder{text-align:center;padding:50px 20px;color:var(--muted);}
.placeholder .ph-icon{font-size:2.5rem;margin-bottom:10px;}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* RESPONSIVE */
@media(max-width:960px){.main-grid{grid-template-columns:1fr;}.kpi-strip{grid-template-columns:repeat(3,1fr);}.rankings-grid{grid-template-columns:1fr;}}
@media(max-width:600px){.kpi-strip{grid-template-columns:repeat(2,1fr);}.stats-row{grid-template-columns:repeat(2,1fr);}}
</style>
</head>

const PROF_LEVELS = [
  {key:'Highly Proficient',short:'HP',range:'90–100',cls:'pb-hp',color:'#15803D',bg:'#DCFCE7',icon:'🌟'},
  {key:'Proficient',short:'P',range:'75–89',cls:'pb-p',color:'#1D4ED8',bg:'#DBEAFE',icon:'✅'},
  {key:'Nearly Proficient',short:'NP',range:'50–74',cls:'pb-np',color:'#B45309',bg:'#FEF3C7',icon:'📈'},
  {key:'Low Proficient',short:'LP',range:'25–49',cls:'pb-lp',color:'#DC2626',bg:'#FEE2E2',icon:'⚠️'},
  {key:'Not Proficient',short:'NotP',range:'0–24',cls:'pb-nprof',color:'#6D28D9',bg:'#EDE9FE',icon:'🔴'},
];

// State
let activeTab = 'schools';
let selSchool = '';
let selDistrict = '';
let searchQ = '';
let profNavLevel = '';
let activeChart = null;
let itemsChartObj = null;

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function getMpsColor(v){
  if(v>=90) return '#15803D';
  if(v>=75) return '#1D4ED8';
  if(v>=50) return '#B45309';
  if(v>=25) return '#DC2626';
  return '#6D28D9';
}
function getHeatColor(v){
  if(v>=75) return {bg:'#15803D',fg:'#fff'};
  if(v>=50) return {bg:'#1D4ED8',fg:'#fff'};
  if(v>=25) return {bg:'#D97706',fg:'#fff'};
  return {bg:'#DC2626',fg:'#fff'};
}
function profBadge(p){
  const l=PROF_LEVELS.find(x=>x.key===p)||PROF_LEVELS[4];
  return `<span class="prof-badge ${l.cls}">${l.icon} ${l.short}</span>`;
}
function mpsBar(mps,max=100){
  const c=getMpsColor(mps);
  return `<div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${(mps/max)*100}%;background:${c}"></div></div><span class="pct-text" style="color:${c}">${mps.toFixed(1)}%</span></div>`;
}
function destroyChart(id){
  const c=Chart.getChart(id);if(c)c.destroy();
}

// ══════════════════════════════════════════════════════
// KPI STRIP
// ══════════════════════════════════════════════════════
function renderKPI(){
  const o=DATA.overall;
  const topMps=Math.max(...DATA.schools.map(s=>s.avg_mps));
  const botMps=Math.min(...DATA.schools.map(s=>s.avg_mps));
  const npCount=(o.proficiency_counts['Proficient']||0)+(o.proficiency_counts['Highly Proficient']||0);
  const items=[
    {icon:'👥',val:o.total_students.toLocaleString(),lbl:'Total Learners',color:'#2563EB'},
    {icon:'🏫',val:o.total_schools,lbl:'Total Schools',color:'#0891B2'},
    {icon:'📍',val:o.total_districts,lbl:'Districts',color:'#6D28D9'},
    {icon:'📊',val:o.avg_mps.toFixed(1)+'%',lbl:'Division MPS',color:getMpsColor(o.avg_mps)},
    {icon:'🌟',val:topMps.toFixed(1)+'%',lbl:'Highest MPS',color:'#15803D'},
    {icon:'⚠️',val:botMps.toFixed(1)+'%',lbl:'Lowest MPS',color:'#DC2626'},
  ];
  document.getElementById('kpiStrip').innerHTML=items.map(k=>`
    <div class="kpi-card" style="border-top-color:${k.color}">
      <div class="kpi-icon">${k.icon}</div>
      <div class="kpi-val" style="color:${k.color}">${k.val}</div>
      <div class="kpi-lbl">${k.lbl}</div>
    </div>`).join('');
}

// ══════════════════════════════════════════════════════
// TAB SWITCHING
// ══════════════════════════════════════════════════════
function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.nav-tab').forEach((t,i)=>{
    const tabs=['schools','districts','proficiency','rankings','items'];
    t.classList.toggle('active',tabs[i]===tab);
  });
  renderNav();
  if(tab==='schools'&&selSchool) renderSchoolDetail(selSchool);
  else if(tab==='districts'&&selDistrict) renderDistrictDetail(selDistrict);
  else if(tab==='proficiency') renderProficiencyDetail(profNavLevel||'');
  else if(tab==='rankings') renderRankingsDetail();
  else if(tab==='items') renderItemsDetail();
  else renderDivisionOverview();
}

function renderNav(){
  const nb=document.getElementById('navBody');
  if(activeTab==='schools') renderSchoolsNav(nb);
  else if(activeTab==='districts') renderDistrictsNav(nb);
  else if(activeTab==='proficiency') renderProficiencyNav(nb);
  else if(activeTab==='rankings') renderRankingsNav(nb);
  else renderItemsNav(nb);
}

// ══════════════════════════════════════════════════════
// SCHOOLS NAV
// ══════════════════════════════════════════════════════
function renderSchoolsNav(nb){
  nb.innerHTML=`<div style="padding:8px 4px 4px">
    <div class="search-wrap"><span class="s-icon">🔍</span><input placeholder="Search school..." oninput="searchQ=this.value;renderSchoolsNav(document.getElementById('navBody'))" value="${searchQ}"></div>
  </div>`;
  const list=DATA.schools.filter(s=>s.school.toLowerCase().includes(searchQ.toLowerCase()));
  list.forEach(s=>{
    const el=document.createElement('div');
    el.className='list-item'+(selSchool===s.school?' active':'');
    const pc=getMpsColor(s.avg_mps);
    el.innerHTML=`<div class="list-icon">🏫</div>
      <div style="flex:1;min-width:0">
        <div class="list-name">${s.school}</div>
        <div class="list-sub">${s.district} · ${s.total_students.toLocaleString()} students</div>
        <div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;">
          <span style="font-size:.62rem;font-weight:700;color:${pc};background:${pc}22;border-radius:4px;padding:1px 6px;">MPS ${s.avg_mps.toFixed(1)}%</span>
          ${profBadge(s.proficiency)}
        </div>
        <div class="mini-bar-wrap" style="margin-top:4px"><div class="mini-bar" style="width:${s.avg_mps}%;background:${pc}"></div></div>
      </div>`;
    el.onclick=()=>{selSchool=s.school;renderSchoolsNav(document.getElementById('navBody'));renderSchoolDetail(s.school);};

    <div style="border-left:1px solid #BFDBFE;padding-left:16px;"><div style="font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:3px">Needs Support</div><div style="font-weight:900;color:#DC2626;font-size:.95rem">⚠️ ${bot10[0].school} — ${bot10[0].avg_mps.toFixed(1)}%</div></div>
  </div>

  <div class="rankings-grid">
    <div class="rank-card">
      <div class="rank-head top">🏆 Top 10 Schools</div>
      <table class="rank-table"><thead><tr><th>#</th><th>School</th><th style="text-align:right">MPS</th></tr></thead><tbody>${top10.map((s,i)=>rankRow(s,i)).join('')}</tbody></table>
    </div>
    <div class="rank-card">
      <div class="rank-head bot">⚠️ Bottom 10 — Need Support</div>
      <table class="rank-table"><thead><tr><th>#</th><th>School</th><th style="text-align:right">MPS</th></tr></thead><tbody>${bot10.map((s,i)=>rankRow(s,i)).join('')}</tbody></table>
    </div>
  </div>

  <div class="section-sep"></div>
  <p class="summary-section-title" style="margin-top:4px">📍 District MPS Ranking</p>
  ${[...DATA.districts].sort((a,b)=>b.avg_mps-a.avg_mps).map((d,i)=>{const pc=getMpsColor(d.avg_mps);const rn=i===0?'rank-gold':i===1?'rank-silver':i===2?'rank-bronze':'rank-other';return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #F1F5F9"><span class="rank-num ${rn}" style="flex-shrink:0">${i+1}</span><span style="flex:1;font-weight:700;font-size:.82rem">${d.district}</span><div class="bar-bg" style="width:160px"><div class="bar-fill" style="width:${d.avg_mps}%;background:${pc}"></div></div><span style="font-weight:900;font-size:.85rem;color:${pc};min-width:48px;text-align:right">${d.avg_mps.toFixed(1)}%</span></div>`;}).join('')}
  <div style="margin-top:16px;font-size:.7rem;color:var(--muted);text-align:center">📌 Project KABULIG | SDO Romblon CID | Developed by Sir Dyon</div>`;

}

// ITEMS DETAIL
// ══════════════════════════════════════════════════════
function renderItemsDetail(){
  document.getElementById('detailTitle').textContent='📝 Item Analysis';
  document.getElementById('detailSub').textContent='Percentage of students who answered each item correctly';

  let opts=`<option value="all">All Schools (Division-wide)</option>`;
  DATA.districts.forEach(d=>{opts+=`<option value="dist:${d.district}">📍 District: ${d.district}</option>`;});
  DATA.schools.forEach(s=>{opts+=`<option value="school:${s.school}">🏫 ${s.school}</option>`;});

  let html=`
  <select class="filter-select" id="item-scope-sel" onchange="refreshItemsDetail()">${opts}</select>

  <div class="heatmap-grid" id="items-heatmap" style="margin-bottom:16px"></div>
  <canvas id="chart-items-detail" height="180" style="margin-bottom:18px"></canvas>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
    <div>
      <p class="summary-section-title">📉 Most Difficult (Bottom 10)</p>
      <div id="difficult-list"></div>
    </div>
    <div>
      <p class="summary-section-title">✅ Easiest Items (Top 10)</p>
      <div id="easy-list"></div>
    </div>
  </div>
  <div style="margin-top:16px;font-size:.7rem;color:var(--muted);text-align:center">📌 Project KABULIG | SDO Romblon CID | Developed by Sir Dyon</div>`;

  document.getElementById('detailBody').innerHTML=html;
  refreshItemsDetail();
}

function getItemScope(){
  const sel=document.getElementById('item-scope-sel');
  if(!sel) return DATA.overall.item_avg;
  const v=sel.value;
  if(v==='all') return DATA.overall.item_avg;
  if(v.startsWith('school:')){
    const s=DATA.schools.find(x=>x.school===v.slice(7));
    return s?s.item_avg:DATA.overall.item_avg;
  }
  if(v.startsWith('dist:')){
    const dname=v.slice(5);
    const schools=DATA.schools.filter(s=>s.district===dname);
    if(!schools.length) return DATA.overall.item_avg;
    return DATA.overall.item_avg.map((_,i)=>schools.reduce((a,s)=>a+s.item_avg[i],0)/schools.length);
  }
  return DATA.overall.item_avg;
}

function refreshItemsDetail(){
  const items=getItemScope();

  // Heatmap
  document.getElementById('items-heatmap').innerHTML=items.map((v,i)=>{
    const c=getHeatColor(v);
    return `<div class="heatmap-cell" style="background:${c.bg};color:${c.fg}" title="Q${i+1}: ${v.toFixed(1)}% correct"><div style="font-size:.6rem;font-weight:700">Q${i+1}</div><div style="font-size:.7rem;font-weight:900">${v.toFixed(0)}%</div></div>`;
  }).join('');

  // Bar chart
  destroyChart('chart-items-detail');
  new Chart(document.getElementById('chart-items-detail'),{
    type:'bar',
    data:{labels:items.map((_,i)=>`Q${i+1}`),datasets:[{label:'% Correct',data:items,backgroundColor:items.map(v=>getHeatColor(v).bg+'bb'),borderColor:items.map(v=>getHeatColor(v).bg),borderWidth:1,borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.raw.toFixed(1)}% answered correctly`}}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y:{min:0,max:100,ticks:{callback:v=>v+'%'},grid:{color:'#f1f5f9'}}}}
  });

  // Difficult/Easy lists
  const indexed=items.map((v,i)=>({n:i+1,v}));
  const bottom10=[...indexed].sort((a,b)=>a.v-b.v).slice(0,10);
  const top10=[...indexed].sort((a,b)=>b.v-a.v).slice(0,10);
  function renderList(list,el){
    document.getElementById(el).innerHTML=list.map(x=>{
      const c=getHeatColor(x.v);
      return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <div style="width:30px;height:30px;border-radius:7px;background:${c.bg};color:${c.fg};display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.65rem;flex-shrink:0">Q${x.n}</div>
        <div style="flex:1"><div class="mini-bar-wrap"><div class="mini-bar" style="width:${x.v}%;background:${c.bg}"></div></div></div>
        <div style="font-weight:800;font-size:.78rem;color:${c.bg};min-width:38px;text-align:right">${x.v.toFixed(1)}%</div>
      </div>`;
    }).join('');
  }
  renderList(bottom10,'difficult-list');
  renderList(top10,'easy-list');
}

renderNav();
renderDivisionOverview();
