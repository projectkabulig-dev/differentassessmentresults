<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMA KS1 Interactive Dashboard — SDO Romblon</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Raleway:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
  :root {
    --navy:#1B3A6B; --blue:#2563EB; --teal:#0891B2; --green:#16A34A;
    --yellow:#CA8A04; --orange:#EA580C; --red:#DC2626;
    --bg:#F0F4FF; --card:#FFFFFF; --border:#D1D5DB;
    --text:#1E293B; --muted:#64748B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  header{background:linear-gradient(135deg,var(--navy) 0%,#2563EB 100%);color:#fff;padding:20px 32px 16px;display:flex;align-items:center;gap:18px;box-shadow:0 4px 20px rgba(27,58,107,.35);}
  .header-icon{font-size:2.6rem;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));}
  .header-text h1{font-family:'Raleway',sans-serif;font-size:1.35rem;font-weight:900;letter-spacing:.5px;}
  .header-text p{font-size:.78rem;opacity:.8;margin-top:2px;}
  .header-badge{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 14px;font-size:.75rem;font-weight:700;text-align:center;}
  .shell{max-width:1340px;margin:0 auto;padding:24px 20px;}
  .kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px;}
  .kpi-card{background:var(--card);border-radius:14px;padding:18px 16px 14px;box-shadow:0 2px 10px rgba(0,0,0,.07);border-top:4px solid;transition:transform .15s,box-shadow .15s;}
  .kpi-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12);}
  .kpi-icon{font-size:1.6rem;margin-bottom:6px;}
  .kpi-val{font-family:'Raleway',sans-serif;font-size:1.9rem;font-weight:900;line-height:1;}
  .kpi-lbl{font-size:.73rem;color:var(--muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
  .main-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;}
  .panel{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden;}
  .panel-head{background:var(--navy);color:#fff;padding:13px 18px;font-size:.82rem;font-weight:800;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.6px;}
  .panel-body{padding:14px;overflow-y:auto;max-height:70vh;}
  .nav-tabs{display:flex;gap:0;background:#EEF2FF;border-bottom:2px solid #C7D2FE;}
  .nav-tab{flex:1;padding:9px 4px;text-align:center;font-size:.68rem;font-weight:700;cursor:pointer;color:var(--muted);border:none;background:transparent;transition:all .15s;text-transform:uppercase;letter-spacing:.3px;}
  .nav-tab.active{color:var(--navy);background:#fff;border-bottom:2px solid var(--navy);margin-bottom:-2px;}
  .nav-tab:hover:not(.active){background:#E0E7FF;color:var(--navy);}
  .list-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;cursor:pointer;margin-bottom:5px;transition:background .12s,transform .1s;border:1.5px solid transparent;}
  .list-item:hover{background:#EEF2FF;transform:translateX(2px);border-color:#C7D2FE;}
  .list-item.active{background:#EEF2FF;border-color:var(--navy);}
  .list-icon{font-size:1.3rem;flex-shrink:0;}
  .list-name{font-weight:700;font-size:.82rem;flex:1;}
  .list-sub{font-size:.7rem;color:var(--muted);}
  .list-badge{font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:20px;color:#fff;flex-shrink:0;}
  .mini-bar-wrap{height:5px;background:#E2E8F0;border-radius:3px;margin-top:3px;overflow:hidden;width:100%;}
  .mini-bar{height:100%;border-radius:3px;transition:width .4s ease;}
  .right-panel{display:flex;flex-direction:column;gap:18px;}
  .detail-card{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden;}
  .detail-head{padding:18px 22px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;}
  .detail-head h2{font-family:'Raleway',sans-serif;font-size:1.15rem;font-weight:900;}
  .detail-head p{font-size:.78rem;opacity:.8;margin-top:3px;}
  .detail-body{padding:20px 22px;}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .stat-box{background:#F8FAFF;border-radius:10px;padding:12px 14px;text-align:center;border:1.5px solid #E0E7FF;}
  .stat-box .sv{font-size:1.5rem;font-weight:900;font-family:'Raleway',sans-serif;}
  .stat-box .sl{font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase;margin-top:2px;}
  .prof-table{width:100%;border-collapse:collapse;font-size:.82rem;}
  .prof-table th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;}
  .prof-table td{padding:8px 12px;border-bottom:1px solid #F1F5F9;vertical-align:middle;}
  .prof-table tr:last-child td{border-bottom:none;}
  .prof-table tr:hover td{background:#F8FAFF;}
  .prof-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;}
  .bar-cell{display:flex;align-items:center;gap:8px;}
  .bar-bg{flex:1;height:8px;background:#E2E8F0;border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);}
  .pct-text{font-weight:800;width:46px;text-align:right;font-size:.8rem;}
  .count-text{font-weight:700;width:36px;text-align:right;color:var(--muted);font-size:.8rem;}
  .grade-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .grade-tab{padding:6px 18px;border-radius:20px;border:2px solid var(--border);background:transparent;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--muted);transition:all .15s;}
  .grade-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .grade-tab:hover:not(.active){border-color:var(--navy);color:var(--navy);}
  .donut-row{display:flex;align-items:center;gap:20px;margin-bottom:20px;}
  .donut-wrap{flex-shrink:0;position:relative;width:120px;height:120px;}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut-center .dc-val{font-size:1.4rem;font-weight:900;font-family:'Raleway',sans-serif;color:var(--green);}
  .donut-center .dc-lbl{font-size:.6rem;color:var(--muted);font-weight:700;}
  .legend-list{flex:1;}
  .legend-item{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:.76rem;}
  .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .legend-name{flex:1;color:var(--text);font-weight:600;}
  .legend-val{font-weight:800;font-size:.76rem;}
  .summary-section-title{font-size:.8rem;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #E0E7FF;}
  .placeholder{text-align:center;padding:60px 20px;color:var(--muted);}
  .placeholder .ph-icon{font-size:3rem;margin-bottom:12px;}
  .placeholder p{font-size:.85rem;}
  .search-wrap{position:relative;margin-bottom:12px;}
  .search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1.5px solid var(--border);border-radius:8px;font-size:.8rem;font-family:'Nunito',sans-serif;outline:none;transition:border .15s;}
  .search-wrap input:focus{border-color:var(--blue);}
  .search-wrap .s-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.9rem;color:var(--muted);}
  .bg-hp{background:#16A34A;} .bg-p{background:#2563EB;} .bg-np{background:#CA8A04;} .bg-lp{background:#EA580C;} .bg-not{background:#DC2626;}
  .section-sep{height:1px;background:#E0E7FF;margin:20px 0;}
  .back-btn{display:inline-flex;align-items:center;gap:5px;background:#EEF2FF;border:1.5px solid #C7D2FE;border-radius:8px;padding:5px 12px;font-size:.75rem;font-weight:700;cursor:pointer;color:var(--navy);margin-bottom:14px;transition:background .12s;}
  .back-btn:hover{background:#E0E7FF;}
  /* RANKINGS */
  .rankings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .rank-card{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.07);overflow:hidden;}
  .rank-head{padding:13px 18px;font-size:.82rem;font-weight:800;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.6px;color:#fff;}
  .rank-head.top{background:linear-gradient(135deg,#16A34A,#0891B2);}
  .rank-head.bot{background:linear-gradient(135deg,#DC2626,#EA580C);}
  .rank-table{width:100%;border-collapse:collapse;font-size:.8rem;}
  .rank-table th{background:#F8FAFF;color:var(--navy);padding:8px 12px;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #E0E7FF;}
  .rank-table td{padding:8px 12px;border-bottom:1px solid #F1F5F9;vertical-align:middle;}
  .rank-table tr:last-child td{border-bottom:none;}
  .rank-table tr:hover td{background:#F8FAFF;cursor:pointer;}
  .rank-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;font-weight:900;font-size:.8rem;flex-shrink:0;}
  .rank-gold{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;}
  .rank-silver{background:linear-gradient(135deg,#C0C0C0,#909090);color:#000;}
  .rank-bronze{background:linear-gradient(135deg,#CD7F32,#8B4513);color:#fff;}
  .rank-other{background:#EEF2FF;color:var(--navy);}
  .rank-select{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.78rem;font-family:'Nunito',sans-serif;color:var(--text);background:var(--card);outline:none;cursor:pointer;}
  .rank-select:focus{border-color:var(--blue);}
  @media(max-width:900px){.main-grid{grid-template-columns:1fr;}.kpi-strip{grid-template-columns:repeat(3,1fr);}.rankings-grid{grid-template-columns:1fr;}}
  @media(max-width:600px){.kpi-strip{grid-template-columns:repeat(2,1fr);}.stats-row{grid-template-columns:repeat(2,1fr);}}
  </style>
</head>

const LEVELS = ['Not Proficient','Low Proficient','Nearly Proficient','Proficient','Highly Proficient'];
const LEVEL_COLORS = {'Not Proficient':'#DC2626','Low Proficient':'#EA580C','Nearly Proficient':'#CA8A04','Proficient':'#2563EB','Highly Proficient':'#16A34A'};
const LEVEL_ICONS  = {'Not Proficient':'&#128308;','Low Proficient':'&#128992;','Nearly Proficient':'&#128993;','Proficient':'&#128309;','Highly Proficient':'&#128994;'};
const DISTRICT_ICONS = ['&#127757;','&#127754;','&#127968;','&#9968;','&#127807;','&#127749;','&#127751;','&#127750;','&#9973;','&#127806;','&#127796;','&#127969;','&#127820;'];

function aggDistrict(dist){
  const schools=RAW[dist];
  let en=0,as=0,not=0,low=0,np=0,p=0,hp=0;
  for(const s of Object.values(schools)){
    en+=s.enrolled;as+=s.assessed;
    not+=s.proficiency['Not Proficient'];low+=s.proficiency['Low Proficient'];
    np+=s.proficiency['Nearly Proficient'];p+=s.proficiency['Proficient'];hp+=s.proficiency['Highly Proficient'];
  }
  return {enrolled:en,assessed:as,'Not Proficient':not,'Low Proficient':low,'Nearly Proficient':np,'Proficient':p,'Highly Proficient':hp};
}
function divisionTotal(){
  let en=0,as=0,not=0,low=0,np=0,p=0,hp=0;
  for(const d of Object.keys(RAW)){const a=aggDistrict(d);en+=a.enrolled;as+=a.assessed;not+=a['Not Proficient'];low+=a['Low Proficient'];np+=a['Nearly Proficient'];p+=a['Proficient'];hp+=a['Highly Proficient'];}
  return {enrolled:en,assessed:as,'Not Proficient':not,'Low Proficient':low,'Nearly Proficient':np,'Proficient':p,'Highly Proficient':hp};
}
function pct(n,d){return d>0?(n/d*100).toFixed(1)+'%':'0%';}
function pctNum(n,d){return d>0?n/d*100:0;}
function getBadgeColor(hp){if(hp>=70)return '#16A34A';if(hp>=50)return '#2563EB';if(hp>=30)return '#CA8A04';return '#DC2626';}

let activeTab='district', selDistrict=null, selSchool=null, selGrade='All', searchQ='';
let distNavLevel='Highly Proficient';
let profNavExpanded=null, profNavScope='all';
let rankDistrict='', rankMetric='hp_pct';

// KPI
function renderKPI(){
  const div=divisionTotal();
  const ns=Object.values(RAW).reduce((a,d)=>a+Object.keys(d).length,0);

// TABS
function switchTab(tab){
  activeTab=tab;
  if(tab!=='rankings'){selDistrict=null;selSchool=null;searchQ='';}
  document.querySelectorAll('.nav-tab').forEach((b,i)=>{b.classList.toggle('active',['district','school','proficiency','rankings'][i]===tab);});
  renderNav();renderDetail();
}

function renderNav(){
  const nb=document.getElementById('navBody');
  if(activeTab==='district') renderDistrictNav(nb);
  else if(activeTab==='school') renderSchoolNav(nb);
  else if(activeTab==='proficiency') renderProficiencyNav(nb);
  else renderRankingsNav(nb);
}

// DISTRICT NAV — with level toggle icons + all-level mini pills
function renderDistrictNav(nb){
  const districts=Object.keys(RAW);
  const levelPicker=LEVELS.map(l=>`<span onclick="event.stopPropagation();distNavLevel='${l}';renderDistrictNav(document.getElementById('navBody'));" title="${l}" style="cursor:pointer;font-size:1.05rem;padding:3px 4px;border-radius:6px;transition:background .12s;${distNavLevel===l?'background:#E0E7FF;':'opacity:.45;'}">${LEVEL_ICONS[l]}</span>`).join('');
  nb.innerHTML=`<div style="padding:10px 4px 6px"><div class="search-wrap"><span class="s-icon">&#128269;</span><input placeholder="Search district..." oninput="searchQ=this.value;renderDistrictNav(document.getElementById('navBody'))" value="${searchQ}"></div><div style="display:flex;align-items:center;gap:4px;padding:2px 2px 6px;flex-wrap:wrap;"><span style="font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-right:2px;">View:</span>${levelPicker}</div></div>`;
  const filtered=districts.filter(d=>d.toLowerCase().includes(searchQ.toLowerCase()));
  filtered.forEach((d,i)=>{
    const a=aggDistrict(d);
    const lvlCount=a[distNavLevel]||0;
    const lvlPct=pctNum(lvlCount,a.assessed);
    const lvlColor=LEVEL_COLORS[distNavLevel];
    const icon=DISTRICT_ICONS[i%DISTRICT_ICONS.length];
    const sc=Object.keys(RAW[d]).length;
    const el=document.createElement('div');

    el.innerHTML=`<div class="list-icon">${icon}</div><div style="flex:1;min-width:0"><div class="list-name">${d}</div><div class="list-sub">${sc} schools &nbsp;&middot;&nbsp; ${a.assessed.toLocaleString()} assessed</div><div style="display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;">${LEVELS.map(l=>`<span style="font-size:.62rem;font-weight:700;color:${LEVEL_COLORS[l]};background:${LEVEL_COLORS[l]}18;border-radius:4px;padding:1px 5px;">${LEVEL_ICONS[l]} ${pctNum(a[l]||0,a.assessed).toFixed(0)}%</span>`).join('')}</div><div class="mini-bar-wrap" style="margin-top:5px;"><div class="mini-bar" style="width:${lvlPct}%;background:${lvlColor}"></div></div></div><span class="list-badge" style="background:${lvlColor}">${lvlPct.toFixed(0)}%</span>`;
    el.onclick=()=>{selDistrict=d;selSchool=null;renderNav();renderDetail();};
    nb.appendChild(el);
  });
}

// SCHOOL NAV
function renderSchoolNav(nb){
  nb.innerHTML=`<div style="padding:10px 4px 6px"><div class="search-wrap"><span class="s-icon">&#128269;</span><input placeholder="Search school..." oninput="searchQ=this.value;renderSchoolNav(document.getElementById('navBody'))" value="${searchQ}" autofocus></div></div>`;
  if(searchQ.length<2){nb.innerHTML+=`<div class="placeholder"><div class="ph-icon">&#128269;</div><p>Type at least 2 characters to search</p></div>`;return;}
  const q=searchQ.toLowerCase();let count=0;
  for(const [dist,schools] of Object.entries(RAW)){for(const [sn,sd] of Object.entries(schools)){
    if(!sn.toLowerCase().includes(q)&&!dist.toLowerCase().includes(q)) continue;
    count++;
    const hp=pctNum(sd.proficiency['Highly Proficient'],sd.assessed);
    const el=document.createElement('div');
    el.className='list-item'+(selSchool===sn?' active':'');
    el.innerHTML=`<div class="list-icon">&#127983;</div><div style="flex:1;min-width:0"><div class="list-name">${sn}</div><div class="list-sub">${dist}</div><div class="mini-bar-wrap"><div class="mini-bar bg-hp" style="width:${hp}%"></div></div></div><span class="list-badge" style="background:${getBadgeColor(hp)}">${hp.toFixed(0)}%</span>`;
    el.onclick=()=>{selDistrict=dist;selSchool=sn;renderNav();renderDetail();};
    nb.appendChild(el);
  }}
  if(count===0) nb.innerHTML+=`<div class="placeholder"><div class="ph-icon">&#128533;</div><p>No schools found for "<b>${searchQ}</b>"</p></div>`;
}

// HELPERS
function proficiencyTable(profObj,assessed,title){
  const rows=LEVELS.map(l=>{const cnt=profObj[l]||0;const p=pctNum(cnt,assessed);return `<tr><td><span class="prof-dot" style="background:${LEVEL_COLORS[l]}"></span>${l}</td><td class="count-text">${cnt}</td><td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${p}%;background:${LEVEL_COLORS[l]}"></div></div><span class="pct-text" style="color:${LEVEL_COLORS[l]}">${p.toFixed(1)}%</span></div></td></tr>`;}).join('');
  return `<p class="summary-section-title">${title}</p><table class="prof-table"><thead><tr><th>Level</th><th style="text-align:right">Count</th><th>Distribution</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function miniDonut(hp_pct){
  const r=50,cx=60,cy=60,circ=2*Math.PI*r,dash=circ*hp_pct/100;
  return `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E2E8F0" stroke-width="14"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#16A34A" stroke-width="14" stroke-dasharray="${dash} ${circ}" stroke-dashoffset="${circ/4}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/></svg>`;
}

rem;color:var(--muted);text-align:center">&#128204; Project KABULIG | SDO Romblon CID | Developed by Sir Dyon</div>`;

  document.getElementById('detailTitle').textContent=dist+' District';
  document.getElementById('detailSub').textContent=sc_count+' schools \u00b7 '+agg.assessed.toLocaleString()+' learners assessed';

  // Sort schools by selected level
  const sortDesc = rankLevel==='Not Proficient'||rankLevel==='Low Proficient'||rankLevel==='Nearly Proficient';
  const schoolRanked=Object.entries(schools).map(([sn,sd])=>{
    const lvlCount = sd.proficiency[rankLevel]||0;
    const lvlPct = pctNum(lvlCount, sd.assessed);
    return {sn,sd,lvlCount,lvlPct};
  }).sort((a,b)=> sortDesc ? b.lvlPct-a.lvlPct : b.lvlPct-a.lvlPct);

  const lvlColor = LEVEL_COLORS[rankLevel];
  const lvlIcon  = LEVEL_ICONS[rankLevel];

  // Level picker icons for the school ranking table
  const levelPicker = LEVELS.map(l=>`
    <span onclick="renderDistrictDetail('${dist.replace(/'/g,"\\'")}','${l}')"
      title="Rank by ${l}"
      style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:4px 9px;border-radius:20px;margin-right:4px;margin-bottom:4px;transition:all .15s;
             border:1.5px solid ${l===rankLevel?LEVEL_COLORS[l]:'#D1D5DB'};
             background:${l===rankLevel?LEVEL_COLORS[l]+'18':'transparent'};
             color:${l===rankLevel?LEVEL_COLORS[l]:'#64748B'};">
      ${LEVEL_ICONS[l]} <span>${l.replace(' Proficient','').replace('Nearly','Nearly')}</span>
    </span>`).join('');

  // Section title and header adapt to selected level
  const isHP = rankLevel==='Highly Proficient';
  const colHeader = isHP ? '% Highly Proficient' : `% ${rankLevel}`;

  document.getElementById('detailBody').innerHTML=
    `<button class="back-btn" onclick="selDistrict=null;renderDetail()">&#8592; Division Overview</button>`
    +`<div class="donut-row"><div class="donut-wrap">${miniDonut(hp_pct)}<div class="donut-center"><div class="dc-val">${hp_pct.toFixed(0)}%</div><div class="dc-lbl">At Grade<br>Level</div></div></div><div class="legend-list">${LEVELS.map(l=>`<div class="legend-item"><div class="legend-dot" style="background:${LEVEL_COLORS[l]}"></div><span class="legend-name">${l}</span><span class="legend-val" style="color:${LEVEL_COLORS[l]}">${pct(agg[l],agg.assessed)}</span></div>`).join('')}</div></div>`
    +`<div class="stats-row"><div class="stat-box"><div class="sv" style="color:#1B3A6B">${sc_count}</div><div class="sl">Schools</div></div><div class="stat-box"><div class="sv" style="color:#2563EB">${agg.enrolled}</div><div class="sl">Enrolled</div></div><div class="stat-box"><div class="sv" style="color:#0891B2">${agg.assessed}</div><div class="sl">Assessed</div></div><div class="stat-box"><div class="sv" style="color:#16A34A">${agg['Highly Proficient']}</div><div class="sl">At Grade Level</div></div></div>`
    +proficiencyTable(agg,agg.assessed,'District Proficiency Distribution')
    +`<div class="section-sep"></div>`
    +`<div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;">`
    +`<p class="summary-section-title" style="margin-bottom:0;border-bottom:none;">Schools in ${dist}</p>`
    +`<div style="display:flex;flex-wrap:wrap;gap:2px;align-items:center;">`
    +`<span style="font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-right:4px;">Rank by:</span>`
    +levelPicker
    +`</div></div>`
    +`<table class="prof-table"><thead><tr><th>Rank</th><th>School</th><th style="text-align:right">Assessed</th><th>${colHeader}</th></tr></thead><tbody>`
    +schoolRanked.map(({sn,sd,lvlCount,lvlPct},i)=>{
      const rnum=i===0?'rank-gold':i===1?'rank-silver':i===2?'rank-bronze':'rank-other';
      return `<tr onclick="selSchool='${sn.replace(/'/g,"\\'")}';renderDetail();" style="cursor:pointer">`
        +`<td><span class="rank-num ${rnum}">${i+1}</span></td>`
        +`<td><b>${sn}</b></td>`
        +`<td class="count-text">${sd.assessed}</td>`
        +`<td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${lvlPct}%;background:${lvlColor}"></div></div>`
        +`<span class="pct-text" style="color:${lvlColor}">${lvlPct.toFixed(1)}%</span>`
        +`<span style="font-size:.68rem;color:var(--muted);margin-left:4px;">(${lvlCount})</span>`
        +`</div></td></tr>`;
    }).join('')
    +'</tbody></table>';
}


// SCHOOL DETAIL
function renderSchoolDetail(dist,school){
  const sd=RAW[dist][school];
  const hp_pct=pctNum(sd.proficiency['Highly Proficient'],sd.assessed);
  document.getElementById('detailTitle').textContent=school;
  document.getElementById('detailSub').textContent=dist+' District · '+sd.assessed+' learners assessed (KS1)';
  const gradeTabsHtml=['All','Grade 1','Grade 2','Grade 3'].map(g=>`<button class="grade-tab${selGrade===g?' active':''}" onclick="selGrade='${g}';renderSchoolDetail('${dist.replace(/'/g,"\'")}','${school.replace(/'/g,"\'")}');">${g}</button>`).join('');
  let profObj,assessed;
  if(selGrade==='All'){profObj=sd.proficiency;assessed=sd.assessed;}
  else{const gd=sd.grades[selGrade];profObj={...gd};assessed=gd.assessed;delete profObj.assessed;}
  document.getElementById('detailBody').innerHTML=`<button class="back-btn" onclick="selSchool=null;renderDetail()">&#8592; Back to ${dist}</button><div class="donut-row"><div class="donut-wrap">${miniDonut(hp_pct)}<div class="donut-center"><div class="dc-val">${hp_pct.toFixed(0)}%</div><div class="dc-lbl">At Grade<br>Level</div></div></div><div class="legend-list">${LEVELS.map(l=>`<div class="legend-item"><div class="legend-dot" style="background:${LEVEL_COLORS[l]}"></div><span class="legend-name">${l}</span><span class="legend-val" style="color:${LEVEL_COLORS[l]}">${pct(sd.proficiency[l],sd.assessed)}</span></div>`).join('')}</div></div><div class="stats-row"><div class="stat-box"><div class="sv" style="color:#2563EB">${sd.enrolled}</div><div class="sl">Enrolled</div></div><div class="stat-box"><div class="sv" style="color:#0891B2">${sd.assessed}</div><div class="sl">Assessed</div></div><div class="stat-box"><div class="sv" style="color:#16A34A">${sd.proficiency['Highly Proficient']}</div><div class="sl">Highly Proficient</div></div><div class="stat-box"><div class="sv" style="color:#DC2626">${sd.proficiency['Not Proficient']+sd.proficiency['Low Proficient']}</div><div class="sl">Need Support</div></div></div><div class="section-sep"></div><div class="grade-tabs">${gradeTabsHtml}</div>${proficiencyTable(profObj,assessed,selGrade==='All'?'Overall Proficiency (KS1)':'Grade-Level Proficiency')}<div class="section-sep"></div><p class="summary-section-title">Grade-Level Breakdown (G1 · G2 · G3)</p><table class="prof-table"><thead><tr><th>Grade</th><th style="text-align:right">Assessed</th><th>% Highly Proficient</th></tr></thead><tbody>${['Grade 1','Grade 2','Grade 3'].map(g=>{const gd=sd.grades[g];const hp=pctNum(gd['Highly Proficient'],gd.assessed);return `<tr onclick="selGrade='${g}';renderSchoolDetail('${dist.replace(/'/g,"\'")}','${school.replace(/'/g,"\'")}');" style="cursor:pointer"><td><b>${g}</b></td><td class="count-text">${gd.assessed}</td><td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${hp}%;background:${getBadgeColor(hp)}"></div></div><span class="pct-text" style="color:${getBadgeColor(hp)}">${hp.toFixed(1)}%</span></div></td></tr>`;}).join('')}</tbody></table>`;
}

// PROFICIENCY DETAIL — with optional district filter
function renderProficiencyDetail(level,filterDist){
  const scopeLabel=filterDist?filterDist+' District':'All Schools';
  document.getElementById('detailTitle').textContent=LEVEL_ICONS[level]+' '+level+' — '+scopeLabel;
  document.getElementById('detailSub').textContent='Schools ranked by count of '+level+' learners';
  let rows=[];
  for(const [dist,schools] of Object.entries(RAW)){
    if(filterDist&&dist!==filterDist) continue;
    for(const [sn,sd] of Object.entries(schools)){
      rows.push({dist,sn,cnt:sd.proficiency[level],assessed:sd.assessed,pct_v:pctNum(sd.proficiency[level],sd.assessed)});
    }
  }
  rows.sort((a,b)=>b.cnt-a.cnt);
  let distSummary='';
  if(!filterDist){
    const distRows=Object.keys(RAW).map(d=>{const a=aggDistrict(d);const dCnt=a[level]||0;const dPct=pctNum(dCnt,a.assessed);return {d,dCnt,dPct};}).sort((a,b)=>b.dPct-a.dPct);
    distSummary='<div class="section-sep"></div><p class="summary-section-title">&#128205; By District</p><table class="prof-table"><thead><tr><th>District</th><th style="text-align:right">Count</th><th>% of Assessed</th></tr></thead><tbody>'+distRows.map(({d,dCnt,dPct})=>`<tr onclick="renderProficiencyDetail('${level}','${d.replace(/'/g,"\'")}');" style="cursor:pointer"><td><b>${d}</b></td><td class="count-text">${dCnt}</td><td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${dPct}%;background:${LEVEL_COLORS[level]}"></div></div><span class="pct-text" style="color:${LEVEL_COLORS[level]}">${dPct.toFixed(1)}%</span></div></td></tr>`).join('')+'</tbody></table>';
  }
  const backBtn=filterDist?`<button class="back-btn" onclick="renderProficiencyDetail('${level}')">&#8592; All Schools</button>`:'';
  const distCol=filterDist?'':'<th>District</th>';
  const distCell=r=>filterDist?'':`<td style="font-size:.75rem;color:var(--muted)">${r.dist}</td>`;
  document.getElementById('detailBody').innerHTML=backBtn+`<div style="background:#FFF7ED;border:1.5px solid ${LEVEL_COLORS[level]};border-radius:10px;padding:14px;margin-bottom:16px"><div style="font-weight:800;color:${LEVEL_COLORS[level]};font-size:.9rem">${LEVEL_ICONS[level]} ${level}${filterDist?' &middot; '+filterDist:''}</div><div style="font-size:.8rem;color:var(--muted);margin-top:4px">Total in scope: <b style="color:${LEVEL_COLORS[level]}">${rows.reduce((a,r)=>a+r.cnt,0).toLocaleString()} learners</b></div></div><table class="prof-table"><thead><tr><th>School</th>${distCol}<th style="text-align:right">Count</th><th>% of Assessed</th></tr></thead><tbody>`+rows.filter(r=>r.cnt>0).map(r=>`<tr onclick="selDistrict='${r.dist.replace(/'/g,"\'")}';selSchool='${r.sn.replace(/'/g,"\'")}';switchTab('district');renderDetail();" style="cursor:pointer"><td><b>${r.sn}</b></td>${distCell(r)}<td class="count-text">${r.cnt}</td><td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${r.pct_v}%;background:${LEVEL_COLORS[level]}"></div></div><span class="pct-text" style="color:${LEVEL_COLORS[level]}">${r.pct_v.toFixed(1)}%</span></div></td></tr>`).join('')+'</tbody></table>'+distSummary;
}

// RANKINGS DETAIL
function getAllSchools(){
  const all=[];
  for(const [dist,schools] of Object.entries(RAW)){for(const [sn,sd] of Object.entries(schools)){
    const hp=sd.proficiency['Highly Proficient'],not_p=sd.proficiency['Not Proficient'],low_p=sd.proficiency['Low Proficient'],as=sd.assessed;
    all.push({district:dist,school:sn,enrolled:sd.enrolled,assessed:as,hp,not_p,low_p,hp_pct:pctNum(hp,as),not_pct:pctNum(not_p,as),need_pct:pctNum(not_p+low_p,as),need:not_p+low_p});
  }}
  return all;
}
function renderRankingsDetail(){
  document.getElementById('detailTitle').textContent='&#127942; School Rankings';
  document.getElementById('detailSub').textContent=rankDistrict?rankDistrict+' District':'All 13 Districts · KS1 (Grades 1–3)';
  let pool=getAllSchools();
  if(rankDistrict) pool=pool.filter(r=>r.district===rankDistrict);
  const metricLabels={hp_pct:'% Highly Proficient',hp:'No. Highly Proficient',not_pct:'% Not Proficient',need_pct:'% Need Support (Not+Low)',assessed:'Total Assessed'};
  const metricFmt=(r,m)=>m==='hp_pct'?r.hp_pct.toFixed(1)+'%':m==='not_pct'?r.not_pct.toFixed(1)+'%':m==='need_pct'?r.need_pct.toFixed(1)+'%':m==='hp'?r.hp.toLocaleString():r.assessed.toLocaleString();
  const metricColor=(r,m)=>(m==='hp_pct'||m==='hp')?getBadgeColor(r.hp_pct):r.not_pct>=20?'#DC2626':r.not_pct>=10?'#EA580C':'#CA8A04';
  const neg=rankMetric==='not_pct'||rankMetric==='need_pct';
  const top10=[...pool].sort((a,b)=>neg?a[rankMetric]-b[rankMetric]:b[rankMetric]-a[rankMetric]).slice(0,10);
  const bot10=[...pool].sort((a,b)=>neg?b[rankMetric]-a[rankMetric]:a[rankMetric]-b[rankMetric]).slice(0,10);
  const topLabel=neg?'&#9989; Best (Lowest '+metricLabels[rankMetric]+')':'&#127942; Top 10 — '+metricLabels[rankMetric];
  const botLabel=neg?'&#9888;&#65039; Most Need Support':'&#9888;&#65039; Bottom 10 — Need Support';
  const rankRow=(r,i)=>{const rnum=i===0?'rank-gold':i===1?'rank-silver':i===2?'rank-bronze':'rank-other';const col=metricColor(r,rankMetric);return `<tr onclick="selDistrict='${r.district.replace(/'/g,"\'")}';selSchool='${r.school.replace(/'/g,"\'")}';switchTab('district');renderDetail();" style="cursor:pointer"><td><span class="rank-num ${rnum}">${i+1}</span></td><td><b>${r.school}</b><div style="font-size:.7rem;color:var(--muted);margin-top:1px">${r.district}</div></td><td style="text-align:right"><b style="color:${col};font-size:.88rem;">${metricFmt(r,rankMetric)}</b><div style="font-size:.68rem;color:var(--muted)">${r.assessed} assessed</div></td></tr>`;};
  const distData=Object.keys(RAW).map(d=>{const a=aggDistrict(d);const hp_pct=pctNum(a['Highly Proficient'],a.assessed);const not_pct=pctNum(a['Not Proficient'],a.assessed);const need_pct=pctNum(a['Not Proficient']+a['Low Proficient'],a.assessed);const val=rankMetric==='hp_pct'?hp_pct:rankMetric==='hp'?a['Highly Proficient']:rankMetric==='not_pct'?not_pct:rankMetric==='need_pct'?need_pct:a.assessed;return {d,val,assessed:a.assessed,sc:Object.keys(RAW[d]).length,hp_pct};}).sort((a,b)=>neg?a.val-b.val:b.val-a.val);
  document.getElementById('detailBody').innerHTML=`<div style="background:#F0FDF4;border:1.5px solid #86EFAC;border-radius:10px;padding:12px 16px;margin-bottom:18px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;"><div><div style="font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Sorted By</div><div style="font-weight:800;color:var(--navy);font-size:.9rem;">&#128202; ${metricLabels[rankMetric]}</div></div><div style="border-left:1px solid #BBF7D0;padding-left:16px;"><div style="font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Schools in Pool</div><div style="font-weight:800;color:var(--navy);font-size:.9rem;">&#127983; ${pool.length} schools</div></div><div style="border-left:1px solid #BBF7D0;padding-left:16px;"><div style="font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Scope</div><div style="font-weight:800;color:var(--navy);font-size:.9rem;">&#128205; ${rankDistrict||'All Districts'}</div></div></div><div class="rankings-grid"><div class="rank-card"><div class="rank-head top">${topLabel}</div><table class="rank-table"><thead><tr><th>#</th><th>School</th><th style="text-align:right">${metricLabels[rankMetric]}</th></tr></thead><tbody>${top10.map((r,i)=>rankRow(r,i)).join('')}</tbody></table></div><div class="rank-card"><div class="rank-head bot">&#9888;&#65039; ${botLabel}</div><table class="rank-table"><thead><tr><th>#</th><th>School</th><th style="text-align:right">${metricLabels[rankMetric]}</th></tr></thead><tbody>${bot10.map((r,i)=>rankRow(r,i)).join('')}</tbody></table></div></div><div class="section-sep"></div><p class="summary-section-title">&#128205; District Averages — ${metricLabels[rankMetric]}</p><table class="prof-table"><thead><tr><th>Rank</th><th>District</th><th style="text-align:right">Schools</th><th style="text-align:right">Assessed</th><th>${metricLabels[rankMetric]}</th></tr></thead><tbody>${distData.map(({d,val,assessed,sc,hp_pct},i)=>{const rnum=i===0?'rank-gold':i===1?'rank-silver':i===2?'rank-bronze':'rank-other';const fmtVal=rankMetric.includes('pct')?val.toFixed(1)+'%':Math.round(val).toLocaleString();const col=getBadgeColor(hp_pct);return `<tr onclick="selDistrict='${d.replace(/'/g,"\'")}';switchTab('district');renderDetail();" style="cursor:pointer"><td><span class="rank-num ${rnum}">${i+1}</span></td><td><b>${d}</b></td><td class="count-text">${sc}</td><td class="count-text">${assessed.toLocaleString()}</td><td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100,val)}%;background:${col}"></div></div><span class="pct-text" style="color:${col}">${fmtVal}</span></div></td></tr>`;}).join('')}</tbody></table><div style="margin-top:16px;font-size:.7rem;color:var(--muted);text-align:center">&#128204; Project KABULIG | SDO Romblon CID | Developed by Sir Dyon</div>`;
}

// INIT
renderKPI();renderNav();renderDetail();
</script>
